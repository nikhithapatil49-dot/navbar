<!DOCTYPE html>
<html>
<head>
<title>Responsive Navbar</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
 margin: 0;
 font-family: Arial;
}
.navbar{
 display: flex;
 justify-content: space-between;
 align-items: center;
 background: black;
 color: white;
 padding: 12px 20px;
}
.logo{
 font-size: 20px;
 font-weight: bold;
}
.nav-links{
 list-style: none;
 display: flex;
 gap: 20px;
 margin: 0;
 padding: 0;
}
.nav-links li a{
 color: white;
 text-decoration: none;
}
.hamburger{
 display: none;
 font-size: 24px;
 cursor: pointer;
}

/* mobile view */
@media (max-width: 768px){
 .hamburger{
  display: block;
 }
 .nav-links{
  position: fixed;
  top: 0;
  right: -250px; /* hidden */
  height: 100%;
  width: 200px;
  background: #222;
  flex-direction: column;
  padding-top: 60px;
  padding-left: 20px;
  transition: right 0.3s ease; /* smooth */
 }
 .nav-links.active{
  right: 0; /* slide-in */
 }
}
.content{
 padding: 30px;
 text-align: center;
}
</style>
</head>
<body>

<nav class="navbar">
 <div class="logo">MyWebsite</div>
 <div class="hamburger" id="hamburger">&#9776;</div>
 <ul class="nav-links" id="navLinks">
  <li><a href="#">Home</a></li>
  <li><a href="#">About</a></li>
  <li><a href="#">Services</a></li>
  <li><a href="#">Contact</a></li>
 </ul>
</nav>

<div class="content">
 <h2>Responsive Navbar Demo</h2>
 <p>Resize window to test</p>
</div>

<script>
let hamburger = document.getElementById("hamburger");
let navLinks = document.getElementById("navLinks");

hamburger.addEventListener("click", function(){
 navLinks.classList.toggle("active");
});
</script>

</body>
</html>
